[workspace]
resolver = "2"
members = [
    "counter-app",
    "counter-app-worker",
    "counter-app-spectra-topics",
    "examples/local-counter-host",
    "examples/counter-ui-e2e",
]
# counter-latency-bench is a Surreal-era harness written against the pre-router
# valence API (SDb / SurrealMemBackend / DatabaseRouter::set_global). It needs a
# dedicated port to valence main before it can rejoin the workspace.
exclude = ["counter-latency-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sean O'Rourke"]
repository = "https://github.com/unified-field-dev/counter-app"
homepage = "https://github.com/unified-field-dev/counter-app"
documentation = "https://github.com/unified-field-dev/counter-app"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[workspace.lints.rust]
missing_docs = "deny"
# leptos-lints (Dylint) names are unknown to rustc/clippy alone
unknown_lints = "allow"
leptos_print_stdout = "deny"
leptos_event_target = "deny"
leptos_event_target_value = "deny"
leptos_unscoped_spawn = "deny"

[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/leptos-rs/leptos-lints", tag = "v0.1.2" }]

# Hydrate WASM for cargo-leptos (debuginfo on this graph overflows rust-lld .debug_str).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
debug = false

[workspace.dependencies]
# Leptos
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_integration_utils = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }
leptos-use = { version = "0.18", default-features = false }
codee = { version = "0.3", default-features = false }

# Common
anyhow = "1"
any_spawner = { version = "0.3", features = ["tokio"] }
async-trait = "0.1"
axum = { version = "0.8.4", default-features = false }
axum-login = "0.18.0"
cfg-if = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }
console_error_panic_hook = "0.1"
console_log = "1"
http = "1"
icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
inventory = "0.3"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple_logger = "5"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
turf = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
tracing = "0.1"
wasm-bindgen = "=0.2.126"
js-sys = "=0.3.103"
web-sys = { version = "=0.3.103", features = ["CssStyleDeclaration", "Document", "DomRect", "Element", "EventTarget", "HtmlElement", "MediaQueryList", "Node", "Storage", "Window"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# Platform — uf-valence (crates.io) + valence-platform (path)
valence = { package = "uf-valence", git = "https://github.com/unified-field-dev/valence", branch = "main", default-features = false, features = ["mem", "sqlite"] }
valence-codegen = { package = "uf-valence-codegen", git = "https://github.com/unified-field-dev/valence", branch = "main" }
higgs = { git = "https://github.com/unified-field-dev/higgs", branch = "main", default-features = false }
higgs-host = { git = "https://github.com/unified-field-dev/higgs", branch = "main", default-features = false }
higgs-identity = { git = "https://github.com/unified-field-dev/higgs", branch = "main", default-features = false }
higgs-macros = { git = "https://github.com/unified-field-dev/higgs", branch = "main" }
lepton = { git = "https://github.com/unified-field-dev/lepton", branch = "main", default-features = false }
lepton-identity = { git = "https://github.com/unified-field-dev/lepton", branch = "main", default-features = false }
chronon-coordinator-macros = { git = "https://github.com/unified-field-dev/chronon-coordinator-macros", branch = "main" }
chronon-valence-identity = { git = "https://github.com/unified-field-dev/chronon-valence-identity", branch = "main" }
boson-valence-identity = { git = "https://github.com/unified-field-dev/boson-valence-identity", branch = "main" }

# Chronon / Boson / Photon / Spectra / Quark — Chronon monorepo L0 path
# (patched for git pins elsewhere).
chronon = { package = "uf-chronon", git = "https://github.com/unified-field-dev/chronon", branch = "main", default-features = false }
chronon-core = { git = "https://github.com/unified-field-dev/chronon", branch = "main" }
chronon-executor = { git = "https://github.com/unified-field-dev/chronon", branch = "main" }
chronon-scheduler = { git = "https://github.com/unified-field-dev/chronon", branch = "main" }
chronon-runtime = { git = "https://github.com/unified-field-dev/chronon", branch = "main", default-features = false }
chronon-coordinator = { git = "https://github.com/unified-field-dev/chronon-coordinator", branch = "main" }
boson = { package = "uf-boson", git = "https://github.com/unified-field-dev/boson", branch = "main", default-features = false }
boson-core = { git = "https://github.com/unified-field-dev/boson", branch = "main" }
boson-macros = { git = "https://github.com/unified-field-dev/boson", branch = "main" }
boson-runtime = { git = "https://github.com/unified-field-dev/boson", branch = "main", default-features = false }
boson-backend-mem = { git = "https://github.com/unified-field-dev/boson", branch = "main" }
boson-coordinator = { git = "https://github.com/unified-field-dev/boson-coordinator", branch = "main" }
photon = { package = "uf-photon", git = "https://github.com/unified-field-dev/photon", branch = "main", default-features = false }
photon-macros = { git = "https://github.com/unified-field-dev/photon", branch = "main" }
photon-runtime = { git = "https://github.com/unified-field-dev/photon", branch = "main", default-features = false }
photon-backend = { git = "https://github.com/unified-field-dev/photon", branch = "main", default-features = false }
photon-leptos = { git = "https://github.com/unified-field-dev/photon-leptos", branch = "main", default-features = false }
photon-leptos-macros = { git = "https://github.com/unified-field-dev/photon-leptos", branch = "main" }
photon-axum = { git = "https://github.com/unified-field-dev/photon-leptos", branch = "main", default-features = false }
spectra = { package = "uf-spectra", git = "https://github.com/unified-field-dev/Spectra", branch = "main", default-features = false, features = ["mem"] }
spectra-core = { package = "uf-spectra-core", git = "https://github.com/unified-field-dev/Spectra", branch = "main" }
quark = { package = "uf-quark", git = "https://github.com/unified-field-dev/quark", branch = "main" }
soliton = { git = "https://github.com/unified-field-dev/soliton", branch = "main" }

# Orbital design-system + product shell (path members below)
orbital = { package = "orbital-ui", git = "https://github.com/unified-field-dev/orbital", branch = "main", default-features = false }
orbital-macros = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-paging = { git = "https://github.com/unified-field-dev/orbital", branch = "main", default-features = false }
orbital-motion = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-data = { git = "https://github.com/unified-field-dev/orbital", branch = "main" }
orbital-charts = { git = "https://github.com/unified-field-dev/orbital", branch = "main", default-features = false }

uf-integrations = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main", default-features = false }
uf-product-macros = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main" }
uf-help-macros = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main" }
uf-help = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main", default-features = false }
uf-product = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main", default-features = false }
uf-notifications-core = { git = "https://github.com/unified-field-dev/uf-notifications", branch = "main" }
lepton-shell = { package = "lepton-shell", git = "https://github.com/unified-field-dev/lepton-uf-app", branch = "main", default-features = false }
gauge = { git = "https://github.com/unified-field-dev/gauge", branch = "main", default-features = false }
tower-sessions = "0.14.0"

counter-app-worker = { path = "counter-app-worker" }
counter-app-spectra-topics = { path = "counter-app-spectra-topics" }

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

# Keep DWARF small enough that leptos/ssr test binaries link under the
# 32-bit relocation limit (same fix as unified-field-embedded).
[profile.dev]
debug = "line-tables-only"

# Pin valence-platform git deps to the local tree so they share one valence-core
# with the path-pinned `valence` above.
[[workspace.metadata.leptos]]
name = "counter-ui-e2e"
output-name = "counter-ui-e2e"
bin-package = "counter-ui-e2e"
lib-package = "counter-ui-e2e"
site-root = "examples/counter-ui-e2e/site"
site-pkg-dir = "pkg"
style-file = "examples/counter-ui-e2e/style/main.scss"
assets-dir = "examples/counter-ui-e2e/public"
end2end-dir = "examples/counter-ui-e2e/end2end"
end2end-cmd = "npm test"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
disable-erase-components = true
lib-profile-dev = "wasm-release"
lib-profile-release = "wasm-release"

# Kits may still declare Valence/Photon/Orbital via crates.io; unify onto uf-dev git.
[patch.crates-io]
uf-valence = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
uf-valence-core = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
uf-valence-codegen = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
