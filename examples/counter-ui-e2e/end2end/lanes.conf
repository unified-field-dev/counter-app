# Settings for run-lanes.sh. Paths are relative to the repo root.
BUILD_CMD="cargo leptos build --project counter-ui-e2e"   # as in ci.yml
PROFILE=debug
SERVER_BIN=counter-ui-e2e          # under ${CARGO_TARGET_DIR:-target}/$PROFILE
SITE_ROOT=examples/counter-ui-e2e/site
OUTPUT_NAME=counter-ui-e2e
PORT=3000                          # lane i serves on PORT + 100 + i
READY_PATH=/health
SERVER_ENV=""
LANE_ENV=""                        # {port} is replaced with the lane's port
LANES_DEFAULT=1
