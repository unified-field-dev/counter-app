[package]
name = "counter-app-spectra-topics"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Photon topic helpers for counter-app Spectra telemetry"

[lints]
workspace = true

[dependencies]
photon = { workspace = true, default-features = false, features = ["runtime"] }
photon-macros = { workspace = true }
spectra = { workspace = true }
spectra-core = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures = "0.3"
tokio = { workspace = true, features = ["rt"] }
